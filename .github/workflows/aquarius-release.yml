name: Build and publish Aquarius DMG

on:
  push:
    branches:
      - "aquarius-release"
    tags:
      - "v*"
      - "aquarius-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag (for example v1.0.5)"
        required: true
        default: "v1.0.5"

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Set release tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^(v|aquarius-)[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.0.5 or aquarius-1.0.5."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate Apple signing secrets
        env:
          APPLE_DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$APPLE_DEVELOPER_CERTIFICATE_BASE64" ||
                -z "$APPLE_DEVELOPER_CERTIFICATE_PASSWORD" ||
                -z "$APPLE_API_KEY_CONTENT" ||
                -z "$APPLE_API_KEY_ID" ||
                -z "$APPLE_API_ISSUER" ]]; then
            echo "::error::Configure the required Apple signing and notarization secrets."
            exit 1
          fi

          key_path="$RUNNER_TEMP/Aquarius-AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"

      - name: Import Apple Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Build web app
        run: npm run build

      - name: Generate macOS app icon
        run: node scripts/generate-aquarius-macos-icon.mjs

      - name: Build signed macOS app
        run: npm run desktop:app

      - name: Notarize and staple app
        env:
          APPLE_API_KEY: ${{ runner.temp }}/Aquarius-AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Aquarius.app "$RUNNER_TEMP/Aquarius.app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Aquarius.app.zip"             --key "$APPLE_API_KEY"             --key-id "$APPLE_API_KEY_ID"             --issuer "$APPLE_API_ISSUER"             --wait
          xcrun stapler staple release/mac-arm64/Aquarius.app
          xcrun stapler validate release/mac-arm64/Aquarius.app

      - name: Verify signed app
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Aquarius.app
          spctl --assess --type execute --verbose=2 release/mac-arm64/Aquarius.app

      - name: Create signed DMG
        run: node scripts/package-aquarius-macos.mjs --skip-app-build

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY: ${{ runner.temp }}/Aquarius-AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit release/Aquarius.dmg             --key "$APPLE_API_KEY"             --key-id "$APPLE_API_KEY_ID"             --issuer "$APPLE_API_ISSUER"             --wait
          xcrun stapler staple release/Aquarius.dmg
          xcrun stapler validate release/Aquarius.dmg
          codesign --verify --verbose=2 release/Aquarius.dmg
          cp release/Aquarius.dmg public/downloads/Aquarius.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: aquarius-dmg
          path: release/Aquarius.dmg

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Aquarius ${{ steps.release.outputs.tag }}
          body: |
            Aquarius for macOS on Apple Silicon (arm64).
            Signed with an Apple Developer ID and notarized by Apple.
          files: release/Aquarius.dmg
