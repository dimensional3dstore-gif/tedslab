name: Build and publish ChronosOS DMG

on:
  push:
    tags:
      - "v*"
      - "chronosos-*"
  workflow_dispatch:

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Require a release tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* && "$GITHUB_REF" != refs/tags/chronosos-* ]]; then
            echo "::error::Run this workflow manually on a ChronosOS release tag."
            exit 1
          fi

      - name: Validate Apple signing secrets
        env:
          APPLE_DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$APPLE_DEVELOPER_CERTIFICATE_BASE64" ||
                -z "$APPLE_DEVELOPER_CERTIFICATE_PASSWORD" ||
                -z "$APPLE_API_KEY_CONTENT" ||
                -z "$APPLE_API_KEY_ID" ||
                -z "$APPLE_API_ISSUER" ]]; then
            echo "::error::Configure APPLE_DEVELOPER_CERTIFICATE_BASE64, APPLE_DEVELOPER_CERTIFICATE_PASSWORD, APPLE_API_KEY_CONTENT, APPLE_API_KEY_ID, and APPLE_API_ISSUER repository secrets."
            exit 1
          fi

          key_path="$RUNNER_TEMP/ChronosOS-AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"

      - name: Import Apple Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Build app
        run: npm run build

      - name: Generate macOS app icon
        run: node scripts/generate-chronosos-macos-icon.mjs

      - name: Build signed macOS app
        run: npm run desktop:app

      - name: Notarize and staple app
        env:
          APPLE_API_KEY: ${{ runner.temp }}/ChronosOS-AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            release/mac-arm64/ChronosOS.app "$RUNNER_TEMP/ChronosOS.app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/ChronosOS.app.zip" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple release/mac-arm64/ChronosOS.app
          xcrun stapler validate release/mac-arm64/ChronosOS.app

      - name: Verify signed app
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/ChronosOS.app
          spctl --assess --type execute --verbose=2 release/mac-arm64/ChronosOS.app

      - name: Create signed DMG
        run: node scripts/package-chronosos-macos.mjs --skip-app-build

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY: ${{ runner.temp }}/ChronosOS-AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit release/Chronos.dmg \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple release/Chronos.dmg
          xcrun stapler validate release/Chronos.dmg
          codesign --verify --verbose=2 release/Chronos.dmg
          cp release/Chronos.dmg public/downloads/Chronos.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-dmg
          path: release/Chronos.dmg

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Chronos.dmg
