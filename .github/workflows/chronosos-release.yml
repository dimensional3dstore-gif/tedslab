name: Build and publish ChronosOS DMG

on:
  push:
    tags:
      - "v*"
      - "chronosos-*"
  workflow_dispatch:

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build app
        run: npm run build

      - name: Package macOS app with create-dmg
        run: npm run desktop:download

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-dmg
          path: release/Chronos.dmg

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Chronos.dmg
